[env:esp32dev]
; Pinned: the build was verified with this version (Arduino-ESP32 3.x core).
platform = espressif32 @ 8.0.0
board = esp32dev
framework = arduino
; Wi-Fi + Bluetooth Classic does not fit the default 1.2 MB app partition.
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 921600
build_flags =
  ; BluetoothSerial is marked deprecated in Arduino-ESP32 3.x but still works.
  -Wno-deprecated-declarations

; DFRobot FireBeetle ESP32-E (backup board). Same chip, same code.
[env:firebeetle32e]
extends = env:esp32dev
board = dfrobot_firebeetle2_esp32e

; Phase 2 experiment: talk to the Evo's LED board over a wired UART tap.
[env:uart-tap]
extends = env:esp32dev
build_flags =
  ${env:esp32dev.build_flags}
  -DEVO_TRANSPORT_UART=1
